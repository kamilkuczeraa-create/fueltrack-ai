<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>FuelTrack AI</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div>
        <div class="eyebrow">FUELTRACK AI</div>
        <h1>Twoje żywienie</h1>
      </div>

      <button id="importBtn" class="primary small">
        ＋ Import Fitatu
      </button>

      <input
        id="fileInput"
        type="file"
        accept=".csv,text/csv"
        hidden
      >
    </header>

    <section id="status" class="status hidden"></section>

    <section class="hero card">

      <div class="hero-title">

        <div>
          <div class="muted">Wybrany dzień</div>
          <h2 id="selectedDateLabel">Brak danych</h2>
        </div>

        <select id="dateSelect" aria-label="Wybierz dzień"></select>

      </div>

      <div class="stats">

        <div>
          <span>🔥</span>
          <b id="kcal">0</b>
          <small>kcal</small>
        </div>

        <div>
          <span>🥩</span>
          <b id="protein">0</b>
          <small>białka</small>
        </div>

        <div>
          <span>🍚</span>
          <b id="carbs">0</b>
          <small>węglowodanów</small>
        </div>

        <div>
          <span>🥑</span>
          <b id="fat">0</b>
          <small>tłuszczu</small>
        </div>

      </div>

    </section>

    <section class="card">

      <div class="section-head">
        <h2>Posiłki</h2>

        <button id="copyBtn" class="secondary">
          📋 Kopiuj pełny raport
        </button>
      </div>

      <div id="meals"></div>

    </section>

    <section class="card">

      <div class="section-head">
        <h2>Makro i mikro</h2>
      </div>

      <div id="micros" class="micro-grid"></div>

    </section>

    <section class="card">

      <div class="section-head">
        <h2>Historia</h2>

        <span id="dayCount" class="pill">
          0 dni
        </span>
      </div>

      <div id="history"></div>

    </section>

    <footer>
      FuelTrack AI v0.2 · dane zapisują się lokalnie na tym urządzeniu
    </footer>

  </main>

  <script src="app.js"></script>

</body>
</html>
